name: ExcelToPdf Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'releases/exceltopdf/v*'
    paths:
      - 'src/ExcelToPdf/**'
      - '.github/workflows/exceltopdf.yml'
  pull_request:
    paths:
      - 'src/ExcelToPdf/**'
      - '.github/workflows/exceltopdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/releases/exceltopdf/v') }}

jobs:
  dotnet:
    name: .NET Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ExcelToPdf
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ExcelToPdf.slnx
      - name: Build
        run: dotnet build ExcelToPdf.slnx --configuration Release --no-restore

  docker:
    name: Docker / ${{ matrix.image }}
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: excel-to-pdf/libreoffice-api
            context: src/ExcelToPdf
            dockerfile: src/ExcelToPdf/ExcelToPdf.LibreOffice.Api/Dockerfile
            cache-scope: exceltopdf-libreoffice-api
          - image: excel-to-pdf/libreoffice-cli
            context: src/ExcelToPdf
            dockerfile: src/ExcelToPdf/ExcelToPdf.LibreOffice.Cli/Dockerfile
            cache-scope: exceltopdf-libreoffice-cli
          - image: excel-to-pdf/proxy
            context: src/ExcelToPdf
            dockerfile: src/ExcelToPdf/ExcelToPdf.Proxy/Dockerfile
            cache-scope: exceltopdf-proxy
          - image: excel-to-pdf/playground
            context: src/ExcelToPdf/ExcelToPdf.Playground
            dockerfile: src/ExcelToPdf/ExcelToPdf.Playground/Dockerfile
            cache-scope: exceltopdf-playground
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Prepare Docker Hub release
        if: startsWith(github.ref, 'refs/tags/releases/exceltopdf/v')
        id: release
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          version="${GITHUB_REF_NAME#releases/exceltopdf/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || ${#version} -gt 128 ]]; then
            echo "::error::Use releases/exceltopdf/vMAJOR.MINOR.PATCH, optionally followed by -prerelease."
            exit 1
          fi
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::Set DOCKERHUB_USERNAME and, optionally, the DOCKERHUB_NAMESPACE variable to a lowercase Docker Hub namespace."
            exit 1
          fi
          repository="${IMAGE_NAME//\//-}"
          echo "image=docker.io/$DOCKERHUB_NAMESPACE/$repository:$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-* ]]; then
            echo "latest=docker.io/$DOCKERHUB_NAMESPACE/$repository:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/releases/exceltopdf/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish image to Docker Hub
        if: startsWith(github.ref, 'refs/tags/releases/exceltopdf/v')
        shell: bash
        env:
          LOCAL_IMAGE: ${{ matrix.image }}:ci
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          LATEST_IMAGE: ${{ steps.release.outputs.latest }}
        run: |
          docker tag "$LOCAL_IMAGE" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
          if [[ -n "$LATEST_IMAGE" ]]; then
            docker tag "$LOCAL_IMAGE" "$LATEST_IMAGE"
            docker push "$LATEST_IMAGE"
          fi
