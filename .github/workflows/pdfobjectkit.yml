name: .Net Build PdfObjectKit

on:
  push:
    branches:
      - '**'
    tags:
      - 'releases/pdfobjectkit/v*'
    paths:
      - 'src/PdfObjectKit/**'
      - '.github/workflows/pdfobjectkit.yml'
  pull_request:
    paths:
      - 'src/PdfObjectKit/**'
      - '.github/workflows/pdfobjectkit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/releases/pdfobjectkit/v') }}

jobs:
  build:
    defaults:
      run:
        working-directory: src/PdfObjectKit

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.100

    - name: Build
      run: dotnet build PdfObjectKit/PdfObjectKit.csproj --configuration Release

    - name: Test Markdown snapshot
      run: dotnet test PdfObjectKit.SnapshotTests/PdfObjectKit.SnapshotTests.csproj --configuration Release

    - name: Upload snapshot differences
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Markdown-snapshot-differences
        path: src/PdfObjectKit/PdfObjectKit.SnapshotTests/Snapshots/*.received.*
        if-no-files-found: ignore

    - name: Upload PdfObjectKit
      uses: actions/upload-artifact@v4
      with:
        name: PdfObjectKit
        path: src/PdfObjectKit/PdfObjectKit/nupkg/*.nupkg

    - name: Publish PdfObjectKit to NuGet
      if: startsWith(github.ref, 'refs/tags/releases/pdfobjectkit/v')
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        dotnet nuget push "PdfObjectKit/nupkg/*.nupkg" \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

  docker:
    name: Docker / ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: pdfobjectkit/playground-api
            context: src/PdfObjectKit
            dockerfile: src/PdfObjectKit/PdfObjectKit.Playground.Api/Dockerfile
            cache-scope: pdfobjectkit-playground-api
          - image: pdfobjectkit/cli
            context: src/PdfObjectKit
            dockerfile: src/PdfObjectKit/PdfObjectKit.Cli/Dockerfile
            cache-scope: pdfobjectkit-cli
          - image: pdfobjectkit/playground
            context: src/PdfObjectKit/PdfObjectKit.Playground.Ui
            dockerfile: src/PdfObjectKit/PdfObjectKit.Playground.Ui/Dockerfile
            cache-scope: pdfobjectkit-playground
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Prepare Docker Hub release
        if: startsWith(github.ref, 'refs/tags/releases/pdfobjectkit/v')
        id: release
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          version="${GITHUB_REF_NAME#releases/pdfobjectkit/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || ${#version} -gt 128 ]]; then
            echo "::error::Use releases/pdfobjectkit/vMAJOR.MINOR.PATCH, optionally followed by -prerelease."
            exit 1
          fi
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::Set DOCKERHUB_USERNAME and, optionally, the DOCKERHUB_NAMESPACE variable to a lowercase Docker Hub namespace."
            exit 1
          fi
          repository="${IMAGE_NAME//\//-}"
          echo "image=docker.io/$DOCKERHUB_NAMESPACE/$repository:$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-* ]]; then
            echo "latest=docker.io/$DOCKERHUB_NAMESPACE/$repository:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/releases/pdfobjectkit/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish image to Docker Hub
        if: startsWith(github.ref, 'refs/tags/releases/pdfobjectkit/v')
        shell: bash
        env:
          LOCAL_IMAGE: ${{ matrix.image }}:ci
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          LATEST_IMAGE: ${{ steps.release.outputs.latest }}
        run: |
          docker tag "$LOCAL_IMAGE" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
          if [[ -n "$LATEST_IMAGE" ]]; then
            docker tag "$LOCAL_IMAGE" "$LATEST_IMAGE"
            docker push "$LATEST_IMAGE"
          fi
