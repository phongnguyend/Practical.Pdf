name: WordToPdf Build

on:
  push:
    paths:
      - 'src/WordToPdf/**'
      - '.github/workflows/wordtopdf.yml'
  pull_request:
    paths:
      - 'src/WordToPdf/**'
      - '.github/workflows/wordtopdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/WordToPdf
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WordToPdf.slnx
      - name: Build
        run: dotnet build WordToPdf.slnx --configuration Release --no-restore

  docker:
    name: Docker / ${{ matrix.image }}
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: word-to-pdf/libreoffice-api
            context: src/WordToPdf
            dockerfile: src/WordToPdf/WordToPdf.LibreOffice.Api/Dockerfile
            cache-scope: wordtopdf-libreoffice-api
          - image: word-to-pdf/libreoffice-cli
            context: src/WordToPdf
            dockerfile: src/WordToPdf/WordToPdf.LibreOffice.Cli/Dockerfile
            cache-scope: wordtopdf-libreoffice-cli
          - image: word-to-pdf/proxy
            context: src/WordToPdf
            dockerfile: src/WordToPdf/WordToPdf.Proxy/Dockerfile
            cache-scope: wordtopdf-proxy
          - image: word-to-pdf/playground
            context: src/WordToPdf/WordToPdf.Playground
            dockerfile: src/WordToPdf/WordToPdf.Playground/Dockerfile
            cache-scope: wordtopdf-playground
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
